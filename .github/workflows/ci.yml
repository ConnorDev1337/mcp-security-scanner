name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format)
        run: ruff format --check src tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85

  self-scan:
    # Exercises the CLI end to end on the bundled examples and keeps the
    # SARIF as an artifact. Not uploaded to code scanning on purpose: the
    # examples are intentionally insecure and would only create noise.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install .
      - name: Insecure example must fail
        run: |
          set +e
          mcp-scanner scan examples/claude_desktop_config.json --tools examples/tools.json \
            --no-pins --sarif results.sarif --json report.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }
      - name: Benign config must pass
        run: mcp-scanner scan tests/fixtures/configs/benign.json --no-pins --fail-on medium
      - name: Frozen pins must flag unapproved tools
        run: |
          set +e
          mcp-scanner scan --tools tests/fixtures/tools/benign.json \
            --pins "$RUNNER_TEMP/pins.json" --frozen-pins --fail-on medium
          code=$?
          set -e
          test "$code" -eq 1 && test ! -e "$RUNNER_TEMP/pins.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-scan
          path: |
            results.sarif
            report.json
