[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-scanner"
version = "0.1.0"
description = "Defensive static scanner for MCP client configurations and tool definitions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["mcp", "model-context-protocol", "security", "sarif", "prompt-injection", "tool-poisoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "jsonschema>=4.21",
    "hypothesis>=6",
]

[project.urls]
Homepage = "https://github.com/ConnorDev1337/mcp-security-scanner"
Issues = "https://github.com/ConnorDev1337/mcp-security-scanner/issues"

[project.scripts]
mcp-scanner = "mcp_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_scanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["mcp_scanner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "D"]
ignore = [
    "D1",      # Docstrings are optional; when present they must be well formed.
    "RUF001",  # Confusable characters in strings are intentional test and rule data.
    "RUF003",  # Same, in comments that document those characters.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S108", "S311", "S603"]
